<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082830">
  <title>إدارة الفصول والطاقة الاستيعابية | trans</title>
  <link rel="stylesheet" href="/trans/admin.css?v=2.2.0">
</head>
<body>
<div id="appShell" class="admin-shell">
  <main class="main">
    <div class="content">
      
      <!-- Page Head -->
      <div class="page-head">
        <div>
          <span class="eyebrow">الطاقة الاستيعابية والموازنة</span>
          <h2>إدارة الشعب وإتاحة استقبال النقل</h2>
          <p>التحكم في إتاحة الفصول للطلاب، استبعاد الشعب الخاصة، وتحديد المستهدفات الاستيعابية.</p>
        </div>
        <div class="toolbar">
          <button id="autoLockBtn" class="btn btn-soft" style="border:1.5px solid #0284c7;color:#0284c7;font-weight:800">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            🔒 قفل الفصول المكتملة وفتح الشواغر آلياً
          </button>
          <button id="autoBtn" class="btn btn-soft">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
            تطبيق الأهداف المقترحة للصف
          </button>
          <button id="saveSchoolAllBtn" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            ⚡ تثبيت وحفظ أهداف الـ 18 فصلاً للشيت
          </button>
        </div>
      </div>

      <div id="pageMsg" class="alert hidden"></div>

      <!-- Grade Selector & Summary -->
      <section class="card">
        <div class="card-head">
          <div>
            <h3>اختر الصف الدراسي</h3>
            <p>إيقاف إتاحة الفصل يخفيه مباشرة ولحظياً من خيارات الطلاب في البوابة.</p>
          </div>
          <div id="gradeTabs" class="grade-tabs"></div>
        </div>
        <div class="card-body">
          <div id="summary" class="kpi-grid" style="margin:0"></div>
        </div>
      </section>

      <!-- Classes Dynamic Cards -->
      <section id="classGrid" class="class-grid"></section>

    </div>
  </main>
</div>

<script src="/assets/config.js?v=2.2.0"></script>
<script src="/trans/common.js?v=2.2.0"></script>
<script src="/trans/classes.js?v=2.2.0"></script>
</body>
</html>
